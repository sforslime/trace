name: Hike
options:
  bundleIdPrefix: app.hike
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.7.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.24.0

targets:
  Hike:
    type: application
    platform: iOS
    sources:
      - path: Hike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hike.Hike
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Hike uses your location to record your trail and show your position on the map."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Hike tracks your trail in the background so you can lock your phone while hiking."
        INFOPLIST_KEY_NSMotionUsageDescription: "Hike uses motion data to count your steps during a hike."
        INFOPLIST_KEY_UIBackgroundModes: "location"
    dependencies:
      - package: MapLibre
      - package: Supabase
